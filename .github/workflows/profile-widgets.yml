name: Refresh profile widgets
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/update_profile.py
      - .github/workflows/profile-widgets.yml
permissions:
  contents: write
concurrency:
  group: profile-widgets
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
      - name: Render public GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py
      - name: Publish versioned image snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/generated
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh public profile widgets'
          revision=$(git rev-parse HEAD)
          python3 scripts/update_profile.py --readme-revision "$revision"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: point widgets to refreshed snapshot'
          fi
          git push origin HEAD:master
